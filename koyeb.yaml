services:
  - name: x-optimus
    type: web
    runtime: python3.12

    build:
      commands:
        - pip install --no-cache-dir -r requirements.txt

    run:
      command: python3 main.py

    env:
      - key: API_ID
        value: ${API_ID}
      - key: API_HASH
        value: ${API_HASH}
      - key: STRING_SESSION
        value: ${STRING_SESSION}
      - key: OWNER
        value: COD LUCAS

    ports:
      - port: 8000
        http: true

    scaling:
      min: 1
      max: 1

    health_check:
      http:
        path: /
        port: 8000
